<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.L.E.R. Móvil - Lectura Recíproca</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: transparent; /* Permite ver el fondo si la app está en una ventana independiente */
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: rgba(255, 255, 255, 0.90); /* Fondo blanco translúcido (90% opacidad) */
            backdrop-filter: blur(5px); /* Efecto esmerilado translúcido moderno */
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            width: 380px; /* Ancho fijo cómodo tipo panel flotante en PC */
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        /* El resto de tus estilos se mantienen igual */
        h3 {
            margin-top: 0;
            text-align: center;
            color: #333;
            font-size: 1.1rem;
            cursor: grab; /* Indica que la cabecera arrastra la ventana */
        }
        h3:active {
            cursor: grabbing;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
            resize: vertical;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        button {
            background-color: #00a884;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        button:active {
            background-color: #008f70;
        }
        .output-box {
            background: rgba(250, 250, 250, 0.95);
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px;
            margin-top: 10px;
            max-height: 250px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.4;
            white-space: pre-wrap;
            box-sizing: border-box;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>S.L.E.R. Móvil</h3>
        <textarea id="texto-input" placeholder="Pega tu texto aquí..."></textarea>
        <button id="btn-procesar">🔄 Aplicar S.L.E.R.</button>
        
        <div id="resultado" class="output-box" style="display:none;"></div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((reg) => console.log('Service Worker registrado:', reg.scope))
                    .catch((err) => console.log('Error Service Worker:', err));
            });
        }
    </script>
</body>
</html>
